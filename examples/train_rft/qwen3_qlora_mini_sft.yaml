### model
model_name_or_path: /ldata/Qwen/Qwen3-32B
report_to: wandb
run_name: mini_sft
quantization_bit: 4
quantization_method: bitsandbytes

### method
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.0
deepspeed: examples/deepspeed/ds_z2_offload_config.json

### dataset
# dataset 由 shell 命令行传入；此处给个默认占位
dataset: trainset_mini_s1ast_202508_202601_20260608
template: qwen3_nothink
cutoff_len: 4596
max_samples: 200
overwrite_cache: true
preprocessing_num_workers: 4

### output
# output_dir 由 shell 命令行传入；此处不写默认，避免误用
logging_steps: 1
save_strategy: epoch
plot_loss: true
overwrite_output_dir: true

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
num_train_epochs: 1
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000

### eval
val_size: 0.05
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 50
